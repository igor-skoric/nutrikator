<script>
  (() => {
    const header = document.querySelector("[data-site-header]");
    if (header) {
      const onScroll = () => {
        header.classList.toggle("is-scrolled", window.scrollY > 12);
      };
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }

    const nav = document.querySelector("[data-nav]");
    const toggle = nav && nav.querySelector(".nav-toggle");
    const panel = document.getElementById("navPanel");
    if (nav && toggle && panel) {
      const setOpen = (open) => {
        nav.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "Zatvori meni" : "Otvori meni");
      };
      toggle.addEventListener("click", () => setOpen(!nav.classList.contains("is-open")));
      panel.querySelectorAll("a").forEach((link) => link.addEventListener("click", () => setOpen(false)));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
      });
    }

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce && "IntersectionObserver" in window) {
      const groups = [];
      const add = (sel, anim) => groups.push({ sel, anim });
      const body = document.body;

      if (body.classList.contains("page-benefiti")) {
        add(".bf-card", "lift");
        add(".bf-teaser", "fade");
        add(".bf-cta-inner", "rise");
      } else if (body.classList.contains("page-usluge")) {
        add(".us-core-card", "lift");
        add(".us-board", "fade");
        add(".us-cta-inner", "rise");
      } else if (body.classList.contains("page-vs")) {
        add(".vs-perks", "row");
        add(".vs-cta-banner", "row");
      } else if (body.classList.contains("page-about")) {
        add(".founder-wrap .photo-frame", "photo");
        add(".founder-wrap .prose", "fade");
        add(".founder-quote", "fade");
        add(".about-copy", "left");
        add(".stat", "right");
      } else if (body.classList.contains("page-paketi")) {
        add(".price-card", "lift");
      } else if (body.classList.contains("page-faq")) {
        add(".faq-board", "fade");
      } else if (body.classList.contains("page-legal")) {
        add(".legal-wrap .body", "fade");
      } else if (!body.classList.contains("page-inner")) {
        add(".why-item", "lift");
        add(".report-card", "rise");
        add(".offer-card", "lift");
        add(".procedure-ask", "fade");
      }

      const play = (el, order) => {
        el.style.setProperty("--i", String(Math.min(order, 5)));
        el.classList.add("is-in");
      };

      const observer = new IntersectionObserver(
        (entries) => {
          entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)
            .forEach((entry, index) => {
              play(entry.target, index);
              observer.unobserve(entry.target);
            });
        },
        { threshold: 0.12, rootMargin: "0px 0px -4% 0px" }
      );

      groups.forEach(({ sel, anim }) => {
        document.querySelectorAll(sel).forEach((el, index) => {
          const top = el.getBoundingClientRect().top;
          el.classList.add("reveal");
          el.dataset.anim = anim;
          if (top < window.innerHeight * 0.9) play(el, index);
          else observer.observe(el);
        });
      });
    }

    const vsSteps = document.querySelectorAll("[data-vs-step]");
    if (vsSteps.length) {
      const reduceVs = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const showStep = (step) => step.classList.add("is-on");
      if (reduceVs || !("IntersectionObserver" in window)) {
        vsSteps.forEach(showStep);
      } else {
        const vsObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            vsObserver.unobserve(entry.target);
            requestAnimationFrame(() => {
              requestAnimationFrame(() => showStep(entry.target));
            });
          });
        }, { threshold: 0.18, rootMargin: "0px 0px -4% 0px" });
        vsSteps.forEach((step) => vsObserver.observe(step));
      }
    }

    const wizard = document.querySelector("[data-order-wizard]");
    if (wizard) {
      const stepButtons = [...wizard.querySelectorAll("[data-order-step]")];
      const panels = [...wizard.querySelectorAll("[data-order-panel]")];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let current = stepButtons.findIndex((btn) => btn.getAttribute("aria-selected") === "true");
      if (current < 0) current = 0;

      const show = (index, focusMode) => {
        const next = Math.max(0, Math.min(index, stepButtons.length - 1));
        current = next;
        stepButtons.forEach((btn, i) => {
          const on = i === next;
          const item = btn.closest(".order-step");
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (item) {
            item.classList.toggle("is-current", on);
            item.classList.toggle("is-done", i < next);
          }
        });
        panels.forEach((panel, i) => {
          panel.hidden = i !== next;
        });
        const active = stepButtons[next];
        const rail = wizard.querySelector(".order-steps");
        const item = active && active.closest(".order-step");
        if (rail && item) {
          const railRect = rail.getBoundingClientRect();
          const itemRect = item.getBoundingClientRect();
          const delta = itemRect.left - railRect.left - (rail.clientWidth - itemRect.width) / 2;
          rail.scrollTo({
            left: Math.max(0, rail.scrollLeft + delta),
            behavior: reduceMotion ? "auto" : "smooth",
          });
        }
        const panel = panels[next];
        if (!panel) return;
        if (focusMode === "panel") {
          const heading = panel.querySelector("h2");
          if (heading) heading.focus({ preventScroll: true });
        } else if (focusMode === "tab" && active) {
          active.focus({ preventScroll: true });
        }
        const top = wizard.getBoundingClientRect().top;
        if (focusMode && (top < 80 || top > window.innerHeight * 0.4)) {
          wizard.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }
      };

      stepButtons.forEach((btn, index) => {
        btn.addEventListener("click", () => show(index, "tab"));
        btn.addEventListener("keydown", (event) => {
          let target = null;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") target = index + 1;
          else if (event.key === "ArrowLeft" || event.key === "ArrowUp") target = index - 1;
          else if (event.key === "Home") target = 0;
          else if (event.key === "End") target = stepButtons.length - 1;
          if (target === null) return;
          event.preventDefault();
          show(target, "tab");
        });
      });

      wizard.addEventListener("click", (event) => {
        const go = event.target.closest("[data-order-go]");
        if (!go || !wizard.contains(go)) return;
        show(Number(go.dataset.orderGo), "panel");
      });
    }

    const faqBoard = document.querySelector("[data-faq-board]");
    if (faqBoard) {
      const faqButtons = [...faqBoard.querySelectorAll("[data-faq-step]")];
      const faqPanels = [...faqBoard.querySelectorAll("[data-faq-panel]")];
      const faqNav = faqBoard.querySelector(".faq-nav");
      const reduceFaq = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let faqCurrent = faqButtons.findIndex((btn) => btn.getAttribute("aria-selected") === "true");
      if (faqCurrent < 0) faqCurrent = 0;

      const scrollFaqNav = (btn) => {
        if (!faqNav || !btn) return;
        const behavior = reduceFaq ? "auto" : "smooth";
        const navRect = faqNav.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();
        if (faqNav.scrollWidth > faqNav.clientWidth + 8) {
          const delta = btnRect.left - navRect.left - (faqNav.clientWidth - btnRect.width) / 2;
          faqNav.scrollTo({ left: Math.max(0, faqNav.scrollLeft + delta), behavior });
        }
        if (faqNav.scrollHeight > faqNav.clientHeight + 8) {
          const delta = btnRect.top - navRect.top - (faqNav.clientHeight - btnRect.height) / 2;
          faqNav.scrollTo({ top: Math.max(0, faqNav.scrollTop + delta), behavior });
        }
      };

      const showFaq = (index, focusMode) => {
        const next = Math.max(0, Math.min(index, faqButtons.length - 1));
        faqCurrent = next;
        faqButtons.forEach((btn, i) => {
          const on = i === next;
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
        });
        faqPanels.forEach((panel, i) => {
          panel.hidden = i !== next;
        });
        const active = faqButtons[next];
        scrollFaqNav(active);
        const panel = faqPanels[next];
        if (focusMode === "panel" && panel) {
          const heading = panel.querySelector("h2");
          if (heading) heading.focus({ preventScroll: true });
        } else if (focusMode === "tab" && active) {
          active.focus({ preventScroll: true });
        }
        if (focusMode) {
          const top = faqBoard.getBoundingClientRect().top;
          if (top < 80 || top > window.innerHeight * 0.35) {
            faqBoard.scrollIntoView({ behavior: reduceFaq ? "auto" : "smooth", block: "start" });
          }
          if (active && active.dataset.faqSlug) {
            history.replaceState(null, "", "#" + active.dataset.faqSlug);
          }
        }
      };

      const fromHash = location.hash.replace("#", "");
      if (fromHash) {
        const hashed = faqButtons.findIndex((btn) => btn.dataset.faqSlug === fromHash);
        if (hashed >= 0) showFaq(hashed);
      }

      faqButtons.forEach((btn, index) => {
        btn.addEventListener("click", () => showFaq(index, "tab"));
        btn.addEventListener("keydown", (event) => {
          let target = null;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") target = index + 1;
          else if (event.key === "ArrowLeft" || event.key === "ArrowUp") target = index - 1;
          else if (event.key === "Home") target = 0;
          else if (event.key === "End") target = faqButtons.length - 1;
          if (target === null) return;
          event.preventDefault();
          showFaq(target, "tab");
        });
      });

      faqBoard.addEventListener("click", (event) => {
        const go = event.target.closest("[data-faq-go]");
        if (!go || !faqBoard.contains(go)) return;
        showFaq(Number(go.dataset.faqGo), "panel");
      });
    }

    const usBoard = document.querySelector("[data-us-board]");
    if (usBoard) {
      const usButtons = [...usBoard.querySelectorAll("[data-us-step]")];
      const usPanels = [...usBoard.querySelectorAll("[data-us-panel]")];
      const usNav = usBoard.querySelector(".us-nav");
      const reduceUs = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const scrollUsNav = (btn) => {
        if (!usNav || !btn) return;
        const behavior = reduceUs ? "auto" : "smooth";
        const navRect = usNav.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();
        if (usNav.scrollWidth > usNav.clientWidth + 8) {
          const delta = btnRect.left - navRect.left - (usNav.clientWidth - btnRect.width) / 2;
          usNav.scrollTo({ left: Math.max(0, usNav.scrollLeft + delta), behavior });
        }
        if (usNav.scrollHeight > usNav.clientHeight + 8) {
          const delta = btnRect.top - navRect.top - (usNav.clientHeight - btnRect.height) / 2;
          usNav.scrollTo({ top: Math.max(0, usNav.scrollTop + delta), behavior });
        }
      };

      const showUs = (index, focusMode) => {
        const next = Math.max(0, Math.min(index, usButtons.length - 1));
        usButtons.forEach((btn, i) => {
          const on = i === next;
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
        });
        usPanels.forEach((panel, i) => {
          panel.hidden = i !== next;
        });
        const active = usButtons[next];
        scrollUsNav(active);
        const panel = usPanels[next];
        if (focusMode === "panel" && panel) {
          const heading = panel.querySelector("h3");
          if (heading) heading.focus({ preventScroll: true });
        } else if (focusMode === "tab" && active) {
          active.focus({ preventScroll: true });
        }
        if (focusMode) {
          const navScrolls = usNav && usNav.scrollWidth > usNav.clientWidth + 8;
          const stage = usBoard.querySelector(".us-stage");
          const target = !navScrolls && stage ? stage : usBoard;
          const top = target.getBoundingClientRect().top;
          if (top < 80 || top > window.innerHeight * 0.3) {
            target.scrollIntoView({ behavior: reduceUs ? "auto" : "smooth", block: "start" });
          }
          if (active && active.dataset.usSlug) {
            history.replaceState(null, "", "#" + active.dataset.usSlug);
          }
        }
      };

      const usHash = location.hash.replace("#", "");
      if (usHash) {
        const hashed = usButtons.findIndex((btn) => btn.dataset.usSlug === usHash);
        if (hashed >= 0) showUs(hashed);
      }

      usButtons.forEach((btn, index) => {
        btn.addEventListener("click", () => showUs(index, "tab"));
        btn.addEventListener("keydown", (event) => {
          let target = null;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") target = index + 1;
          else if (event.key === "ArrowLeft" || event.key === "ArrowUp") target = index - 1;
          else if (event.key === "Home") target = 0;
          else if (event.key === "End") target = usButtons.length - 1;
          if (target === null) return;
          event.preventDefault();
          showUs(target, "tab");
        });
      });

      usBoard.addEventListener("click", (event) => {
        const go = event.target.closest("[data-us-go]");
        if (!go || !usBoard.contains(go)) return;
        showUs(Number(go.dataset.usGo), "panel");
      });
    }

    const tabs = [...document.querySelectorAll("[data-audience-tab]")];
    const panels = [...document.querySelectorAll("[data-audience-panel]")];
    if (!tabs.length) return;
    const activate = (id) => {
      tabs.forEach((tab) => {
        const on = tab.dataset.audienceTab === id;
        tab.classList.toggle("is-active", on);
        tab.setAttribute("aria-selected", on ? "true" : "false");
      });
      panels.forEach((panel) => {
        panel.hidden = panel.dataset.audiencePanel !== id;
      });
    };
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => activate(tab.dataset.audienceTab));
    });
  })();
</script>
